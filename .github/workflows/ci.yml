name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e ".[dev]"
      - name: Ruff
        run: python3 -m ruff check .
      - name: Pytest (mock evolution)
        env:
          SRH_BACKEND: mock
        run: python3 -m pytest -q
      - name: Mock evolution + plot
        env:
          SRH_BACKEND: mock
        run: |
          bash scripts/run_mock_demo.sh
          test -f results/heldout_generations.png
          grep -q MOCK results/evolution_gated.json
